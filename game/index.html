<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Coronas de Ceniza — Demo</title>
<style>
  :root { --gold: #c9a227; --bg: #0b0f13; --panel: #141b22; --txt: #e8e6e3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--txt); font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; user-select: none; }
  canvas#game, canvas#world { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas#game { cursor: crosshair; z-index: 1; }
  .screen { position: fixed; inset: 0; display: none; overflow: auto; background: radial-gradient(ellipse at top, #2a1f12 0%, #0b0f13 60%); padding: 24px 32px; z-index: 5; }
  .screen.on { display: block; }
  .overlay { position: fixed; inset: 0; display: none; background: #000b; z-index: 10; align-items: center; justify-content: center; }
  .overlay.on { display: flex; }
  .panel { background: var(--panel); border: 1px solid var(--gold); border-radius: 8px; padding: 18px 22px; max-height: 90vh; overflow: auto; box-shadow: 0 0 40px #000; }
  h1 { font-family: Georgia, serif; color: var(--gold); letter-spacing: 3px; margin: 0 0 4px; font-size: 44px; text-shadow: 0 0 20px #c9a22755; }
  h2 { color: var(--gold); font-family: Georgia, serif; margin: 18px 0 8px; font-size: 20px; }
  .sub { color: #aaa; margin-bottom: 14px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { background: #182029; border: 2px solid #2b3742; border-radius: 6px; padding: 10px 12px; cursor: pointer; transition: .12s; }
  .card:hover { border-color: #8d7a3a; transform: translateY(-2px); }
  .card.sel { border-color: var(--gold); background: #2a2715; box-shadow: 0 0 12px #c9a22766; }
  .map-card { width: 250px; }
  .map-card b { color: var(--gold); }
  .champ-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .champ { padding: 8px; text-align: center; }
  .champ .ico { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 26px; color: #fff; border: 3px solid #0006; }
  .champ small { color: #9aa; display: block; font-size: 11px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 20px; }
  .detail { position: sticky; top: 0; }
  .ab { margin: 6px 0; padding: 6px 8px; background: #0e1419; border-left: 3px solid var(--gold); font-size: 13px; }
  .ab b { color: #ffd54f; }
  button, select { background: #1f2a33; color: var(--txt); border: 1px solid var(--gold); border-radius: 4px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  button:hover { background: #2c3a45; }
  button.big { font-size: 20px; padding: 12px 40px; background: linear-gradient(#c9a227, #8a6d12); color: #111; font-weight: bold; border: none; }
  button.big:disabled { background: #555; color: #999; cursor: not-allowed; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 5px 8px; border-bottom: 1px solid #2b3742; text-align: left; }
  th { color: var(--gold); }
  .t0 { color: #64b5f6; } .t1 { color: #ef5350; } .cb .t1 { color: #ff9800; }
  .shop-grid { display: grid; grid-template-columns: repeat(3, 230px); gap: 8px; }
  .item { padding: 8px; font-size: 12px; }
  .item b { color: #ffd54f; font-size: 13px; }
  .item.rec { border-color: #4caf50; }
  .item.off { opacity: .5; }
  .kbd { display: inline-block; min-width: 22px; padding: 1px 6px; border: 1px solid #888; border-radius: 3px; background: #222; font-family: monospace; text-align: center; }
  #tutorial { position: fixed; left: 12px; top: 80px; z-index: 4; background: #0b0f13dd; border: 1px solid var(--gold); padding: 10px 14px; border-radius: 6px; font-size: 14px; display: none; max-width: 330px; }
  #tutorial .done { color: #69f0ae; text-decoration: line-through; }
  .muted { color: #8a9; font-size: 12px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #263238; margin: 2px; font-size: 12px; }
  /* ---- controles táctiles (touch.js; solo visibles en móvil) ---- */
  #touchUI { display: none; position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  #touchUI .tb { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; background: #141b22e6; border: 2px solid #8d7a3a; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; line-height: 1.1; box-shadow: 0 2px 10px #000a; transition: transform .08s, background .12s; -webkit-user-select: none; user-select: none; }
  #touchUI .tb.down { transform: scale(1.12); background: #2a2715; }
  #touchUI .tb.hold { box-shadow: 0 0 0 4px #ffd54f88; }
  #touchUI .tb-ab { border-color: var(--gold); font-weight: bold; }
  #touchUI .tb-ab.off, #touchUI .tb-sum.off { opacity: .45; border-color: #555; }
  #touchUI .tb-ab.learn { border-style: dashed; }
  #touchUI .tb-ab.recast { border-color: #00e5ff; box-shadow: 0 0 10px #00e5ff88; }
  #touchUI .tb-attack { background: #3a1414e6; border-color: #ff5252; font-size: 30px; }
  #touchUI .tb-attackTower, #touchUI .tb-attackMinion { font-size: 15px; border-color: #ff8a80; }
  #touchUI .tb-name { max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #touchUI .tb-attack .tb-name, #touchUI .tb-recall .tb-name, #touchUI .tb-ward .tb-name, #touchUI .tb-shop .tb-name, #touchUI .tb-score .tb-name, #touchUI .tb-lock .tb-name, #touchUI .tb-pause .tb-name { font-size: 18px; }
  #touchUI .tb-cd { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 17px; font-weight: bold; color: #fff; }
  #touchUI .tb-cd:not(:empty) { background: #000a; }
  #touchUI .tb-key { position: absolute; left: 7px; bottom: 5px; font-size: 10px; color: var(--gold); }
  #touchUI .tb-rank { position: absolute; right: 6px; bottom: 3px; font-size: 7px; letter-spacing: -1px; color: #ffd54f; }
  #touchUI .tb-plus { display: none; position: absolute; top: -7px; right: -4px; width: 20px; height: 20px; border-radius: 50%; background: #ffd54f; color: #000; font-weight: bold; font-size: 15px; line-height: 20px; text-align: center; }
  #touchUI .tb-ab.canrank .tb-plus { display: block; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 50; background: #0b0f13f2; color: var(--gold); font-family: Georgia, serif; font-size: 24px; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  body.mobile #touchUI { display: block; }
  body.mobile #tutorial { left: auto; right: 12px; top: 70px; max-width: 250px; font-size: 12px; }
  @media (orientation: portrait) { body.mobile #rotate { display: flex; } }
  @media (max-width: 900px), (pointer: coarse) {
    .screen { padding: calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
    h1 { font-size: 28px; letter-spacing: 2px; }
    .layout { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .detail { position: static; }
    .map-card { width: 100%; }
    .champ-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
    .shop-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .panel { padding: 12px 14px; max-width: 96vw; }
    #score .panel, #pause .panel, #help .panel, #shop .panel { min-width: 0 !important; width: 96vw; max-width: 96vw; }
    #score .panel { overflow-x: auto; }
    table { font-size: 12px; }
    th, td { padding: 4px 5px; }
    button, select { min-height: 44px; min-width: 44px; padding: 8px 14px; }
    .card { min-height: 44px; }
    .overlay { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  }

  /* ================= selección de campeón (Wild Rift) ================= */
  #menu { padding: 0; overflow: hidden; display: none; grid-template-rows: 54px minmax(0, 1fr) 56px; background: radial-gradient(ellipse at 50% 0%, #223a5e 0%, #0e1a2b 45%, #070c14 100%); font-family: 'Segoe UI', Roboto, sans-serif; }
  #menu.on { display: grid; }
  #menu h2 { font-size: 15px; margin: 8px 0 4px; }
  #selCab { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 16px 0; }
  .pres { display: flex; gap: 8px; } .pres.rival { justify-content: flex-end; }
  .pres .c { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #c9a227aa; background: #0b1220 center/cover; display: flex; align-items: center; justify-content: center; color: #889; font-size: 15px; box-shadow: 0 0 0 2px #0008; transition: transform .25s, border-color .25s; }
  .pres .c.vacio { border-color: #44506a; } .pres.rival .c { border-color: #e5737388; } .pres .c.jug { border-color: #ffd54f; transform: scale(1.08); }
  .cabCentro { text-align: center; line-height: 1.05; }
  .cabTitulo { color: #e9d8a6; font: 600 13px Georgia, serif; letter-spacing: 2px; text-transform: uppercase; }
  .cuenta { color: #ff8a65; font: bold 26px Georgia, serif; text-shadow: 0 0 14px #ff704388; }
  .cuenta.urgente { color: #ff5252; animation: latido .6s infinite alternate; }
  @keyframes latido { to { transform: scale(1.12); text-shadow: 0 0 22px #ff5252; } }
  #selCuerpo { display: grid; grid-template-columns: minmax(200px, 25%) minmax(0, 1fr) minmax(170px, 22%); gap: 14px; padding: 4px 16px; min-height: 0; }
  #colIzq, #colCentro, #colDer { min-height: 0; overflow: auto; scrollbar-width: thin; }
  .modos { margin-bottom: 6px; } .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
  .chips .card { padding: 3px 9px; font-size: 11px; min-height: 0 !important; border-width: 1px; border-radius: 12px; background: #141c2b; }
  .chips .card.sel { background: #3a2f12; }
  .chips .card b { color: #e9d8a6; font-weight: 600; } .chips .card .muted { display: none; }
  #aliados .fila { display: grid; grid-template-columns: 26px 46px minmax(0, 1fr) 26px; gap: 6px; align-items: center; padding: 5px 4px 5px 6px; border-bottom: 1px solid #2b3a52; border-left: 3px solid transparent; }
  #aliados .fila.jug { border-left-color: #ffd54f; background: linear-gradient(90deg, #ffd54f14, transparent); }
  #aliados .fila.jug .pos, #aliados .fila.jug .nom { color: #ffd54f; }
  #aliados .sums { display: flex; flex-direction: column; gap: 3px; }
  .sumMini { width: 22px; height: 22px; border-radius: 4px; border: 1px solid #c9a22766; display: flex; align-items: center; justify-content: center; font-size: 12px; background: #0b1220; }
  #aliados .ret { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #4fc3f788; background: #0b1220 center/cover; display: flex; align-items: center; justify-content: center; color: #9ab; font-size: 18px; }
  #aliados .fila.jug .ret { border-color: #ffd54f; }
  #aliados .pos { color: #b9c3d6; font-size: 10px; letter-spacing: 1px; font-weight: 600; } #aliados .nom { color: #dfe6f1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #aliados .swap { background: transparent; border: none; color: #9ab; font-size: 18px; padding: 0; min-height: 0 !important; min-width: 0 !important; cursor: pointer; }
  #aliados .swap:hover { color: #ffd54f; }
  #filtros { display: flex; gap: 4px; align-items: center; justify-content: center; margin: 2px 0 8px; flex-wrap: wrap; }
  #filtros button { background: transparent; border: none; color: #8a97ad; font-size: 17px; padding: 4px 7px; min-height: 0 !important; min-width: 0 !important; border-bottom: 2px solid transparent; border-radius: 0; }
  #filtros button.sel { color: #fff; border-bottom-color: #c9a227; }
  #filtros input { background: #0b1220; border: 1px solid #2b3a52; color: #eee; border-radius: 14px; padding: 4px 10px; font-size: 12px; width: 110px; min-height: 0 !important; }
  .rejilla { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px 8px; padding: 0 6px; max-width: 760px; margin: 0 auto; }
  .rejilla .champ { padding: 0; background: transparent; border: none; text-align: center; min-height: 0 !important; }
  .rejilla .champ:hover { transform: none; }
  .rejilla .ret { position: relative; width: 100%; aspect-ratio: 1; border-radius: 6px; border: 2px solid #3a4a66; background: #0b1220 center/cover; transition: transform .15s, border-color .15s, box-shadow .15s; }
  .rejilla .champ:hover .ret { transform: translateY(-2px); border-color: #8d7a3a; }
  .rejilla .champ.sel .ret { border-color: #ffd54f; box-shadow: 0 0 0 1px #ffd54f, 0 0 16px #ffd54f66; }
  .rejilla .champ.sel .ret::after { content: ''; position: absolute; inset: 3px; border: 1px solid #ffd54f88; border-radius: 3px; }
  .rejilla .champ .rec { position: absolute; left: -2px; top: -2px; background: #e53935; color: #fff; font-size: 9px; padding: 1px 4px; border-radius: 3px 0 4px 0; }
  .rejilla .champ .ali { position: absolute; right: -2px; top: -2px; background: #29b6f6; color: #06202e; font-size: 9px; padding: 1px 4px; border-radius: 0 3px 0 4px; }
  .rejilla .champ .ini { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: bold 26px Georgia, serif; color: #fff; }
  .rejilla .champ b { display: block; color: #cfd8e6; font-weight: 500; font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rejilla .champ.sel b { color: #ffd54f; }
  #detail { margin: 10px 6px 0; padding: 8px 10px; background: #0b122088; border: 1px solid #2b3a52; border-radius: 8px; font-size: 12px; color: #aab; }
  #detail .abs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  #detail .ab { flex: 1 1 120px; margin: 0; padding: 4px 6px; font-size: 11px; }
  #detail .ab b { font-size: 11px; }
  #rivales .fila { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 6px; align-items: center; padding: 6px 4px; border-bottom: 1px solid #2b3a52; color: #dfe6f1; font-size: 13px; text-align: right; }
  #rivales .ret { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #e5737388; background: #0b1220 center/cover; display: flex; align-items: center; justify-content: center; color: #889; font-size: 18px; }
  #rivales .fila.visto { background: linear-gradient(270deg, #e5393522, transparent); }
  #colDer #play { width: 100%; margin-top: 10px; font-size: 14px; padding: 10px 8px; }
  #barraInf { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px; border-top: 1px solid #2b3a5266; }
  #barraInf .izq, #barraInf .der { display: flex; align-items: center; gap: 10px; }
  #barraInf button { min-height: 0 !important; }
  #barraInf #fichaBtn { position: static; border-radius: 16px; padding: 6px 12px; font-size: 12px; box-shadow: none; display: none; }
  #barraInf #fichaBtn.on { display: inline-block; }
  #barraInf .izq > button:not(#fichaBtn) { background: transparent; border: none; color: #8a97ad; font-size: 20px; padding: 2px 6px; }
  #barraInf .redondo { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 2px solid #c9a227; background: #0b1220; color: #e9d8a6; font-size: 18px; padding: 0; line-height: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #barraInf .redondo small { font-size: 8px; letter-spacing: .5px; color: #9ab; }
  #barraInf .redondo:disabled { opacity: .4; }
  #barraInf .badge { position: absolute; right: -4px; bottom: -4px; width: 17px; height: 17px; border-radius: 50%; background: #ffd54f; color: #000; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
  #barraInf .badge.off { display: none; }
  .hechizosSel { display: flex; gap: 6px; margin-left: 6px; }
  .sumIco { width: 44px; height: 44px; border-radius: 6px; border: 2px solid #c9a227; background: #0b1220; font-size: 22px; padding: 0; display: flex; align-items: center; justify-content: center; color: #fff; text-shadow: 0 0 6px #000; }
  .sumIco.activo { box-shadow: 0 0 0 2px #ffd54f, 0 0 12px #ffd54f88; }
  /* paneles laterales */
  #velo { display: none; position: fixed; inset: 0; z-index: 7; background: #0b122066; backdrop-filter: blur(3px); }
  #velo.on { display: block; }
  .lateral { display: none; position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 58vw); z-index: 8; background: linear-gradient(180deg, #16243a, #0b1220); border-left: 1px solid #c9a22755; box-shadow: -20px 0 60px #000a; padding: 14px 22px; overflow: auto; animation: entra .25s ease-out; }
  .lateral.on { display: block; }
  @keyframes entra { from { transform: translateX(40px); opacity: 0; } }
  .lateral .cab { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #c9a22744; padding-bottom: 8px; margin-bottom: 10px; }
  .lateral .cab h2 { margin: 0; font-size: 18px; letter-spacing: 2px; color: #e9d8a6; }
  .lateral .cerrar { background: transparent; border: none; color: #e9d8a6; font-size: 24px; padding: 0 6px; }
  .lateral .sub { color: #e9d8a6; font-size: 12px; letter-spacing: 2px; margin: 6px 0 10px; }
  .lateral .tabs { display: flex; gap: 4px; }
  .lateral .tabs button { flex: 1; background: transparent; border: none; border-bottom: 2px solid transparent; border-radius: 0; color: #8a97ad; font: 600 12px Georgia, serif; letter-spacing: 1.5px; padding: 8px 2px; }
  .lateral .tabs button.sel { color: #fff; border-bottom-color: #c9a227; }
  .grid9 { display: grid; grid-template-columns: repeat(5, 56px); gap: 12px; }
  .hechizo { width: 56px; height: 56px; border-radius: 6px; border: 2px solid #3a4a66; font-size: 26px; display: flex; align-items: center; justify-content: center; padding: 0; color: #fff; text-shadow: 0 0 6px #000; transition: transform .12s; }
  .hechizo:hover { transform: scale(1.08); } .hechizo.sel { border-color: #ffd54f; box-shadow: 0 0 10px #ffd54f66; }
  .hechizo.grande { width: 64px; height: 64px; }
  .elegidos { display: flex; justify-content: center; gap: 16px; border-top: 1px solid #c9a22744; padding-top: 16px; margin-top: 20px; }
  .lateral .desc { color: #aab; font-size: 12px; min-height: 32px; margin: 10px 0; }
  /* sets */
  .set { background: #0b122099; border: 1px solid #2b3a52; border-radius: 8px; padding: 0 12px 10px; margin-bottom: 10px; position: relative; }
  .set.sel { background: #0f3a4a66; border-color: #26c6da88; }
  .set .etq { display: inline-block; background: #2e7d32; color: #fff; font-size: 11px; font-weight: 600; letter-spacing: 1px; padding: 2px 10px 2px 8px; clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%); margin-left: -12px; }
  .set .datos { color: #b9c3d6; font-size: 12px; margin: 8px 0 6px; } .set .datos b { color: #e9d8a6; font-weight: 500; margin-right: 14px; }
  .set .fila6, .set .filaR { display: flex; gap: 6px; align-items: flex-start; }
  .obj { width: 42px; text-align: center; } .obj .ico { width: 42px; height: 42px; border-radius: 6px; border: 1px solid #c9a22766; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #10192a; color: #fff; }
  .obj .sw { font-size: 11px; color: #29b6f6; line-height: 1; }
  .runaIco { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #c9a22766; display: flex; align-items: center; justify-content: center; font-size: 16px; background: #10192a; }
  .runaIco.clave { width: 38px; height: 38px; border-width: 2px; }
  .set .filaR { margin-top: 6px; align-items: center; } .set .filaR .sumIco { width: 32px; height: 32px; font-size: 16px; border-width: 1px; margin-left: 4px; }
  .set .accion { position: absolute; right: 12px; top: 40px; width: 44px; height: 44px; border-radius: 6px; font-size: 22px; padding: 0; }
  .set .accion.ok { border: none; background: transparent; color: #26c6da; font-size: 30px; }
  .personal .slots { display: flex; gap: 6px; margin: 8px 0; } .personal .slots .obj .ico { border-style: dashed; cursor: pointer; }
  .personal .inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .personal .inv .item { padding: 6px; font-size: 11px; cursor: pointer; } .personal .inv .item b { font-size: 11px; display: block; }
  .personal .inv .item.en { border-color: #26c6da; }
  /* runas */

  .ramas button.sel { color: #111; font-weight: bold; }
  .claves, .menores { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .runa { background: #10192a; border: 2px solid #3a4a66; border-radius: 8px; padding: 6px 2px; text-align: center; cursor: pointer; font-size: 10px; color: #cfd8e6; min-height: 0 !important; min-width: 0 !important; }
  .runa .i { font-size: 22px; display: block; } .runa.sel { border-color: #ffd54f; background: #3a2f12; } .runa.off { opacity: .35; }
  .paginas { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; } .paginas button { font-size: 12px; padding: 4px 10px; }

<body>
<canvas id="world"></canvas>
<canvas id="game"></canvas>
<div id="touchUI"></div>
<div id="rotate">Gira el móvil<br><small style="color:#ccc;font-size:15px;font-family:sans-serif">Coronas de Ceniza se juega en horizontal</small></div>

<!-- MENÚ PRINCIPAL / SELECCIÓN (disposición Wild Rift: design/ux/wild-rift-disposicion.md §2–§4) -->
<div id="menu" class="screen on">
  <header id="selCab">
    <div class="pres" id="presAliados"></div>
    <div class="cabCentro"><div class="cabTitulo" id="cabTitulo">LOS RIVALES ESTÁN ELIGIENDO</div><div class="cuenta" id="cuenta">60</div></div>
    <div class="pres rival" id="presRivales"></div>
  </header>
  <div id="selCuerpo">
    <aside id="colIzq">
      <div class="modos"><div id="maps" class="chips"></div><div id="diffs" class="chips"></div><div class="muted" id="aramNote"></div></div>
      <div id="aliados"></div>
    </aside>
    <main id="colCentro">
      <div id="filtros"></div>
      <div id="champs" class="rejilla"></div>
      <div id="detail"><i>Toca un campeón para ver sus habilidades; doble toque abre la ficha.</i></div>
    </main>
    <aside id="colDer">
      <div id="rivales"></div>
      <button class="big" id="play" disabled>Fijar preselección</button>
    </aside>
  </div>
  <footer id="barraInf">
    <div class="izq">
      <button id="fichaBtn" title="Ficha del campeón">Ficha del campeón</button>
      <button id="helpBtn" title="Controles">⌨</button><button id="optsBtn" title="Opciones">⚙</button>
    </div>
    <div class="der">
      <button id="btnAspecto" class="redondo" title="Aspecto" disabled>⬆<small>Aspecto</small></button>
      <button id="btnRunas" class="redondo" title="Runas" disabled>⊕<small>Runas</small><span class="badge" id="runasBadge">1</span></button>
      <button id="btnSets" class="redondo" title="Sets de objetos" disabled>▤<small>Sets</small></button>
      <div class="hechizosSel"><button class="sumIco" id="selSum0" data-slot="0"></button><button class="sumIco" id="selSum1" data-slot="1"></button></div>
      <select id="sum0" hidden></select><select id="sum1" hidden></select>
    </div>
  </footer>
</div>
<!-- paneles laterales de la selección (hechizos, sets de objetos, runas) -->
<div id="velo"></div>
<div id="panelHechizos" class="lateral"></div>
<div id="panelSets" class="lateral"></div>
<div id="panelRunas" class="lateral"></div>

<!-- PANTALLA DE CARGA -->
<div id="loading" class="screen"><h1>Cargando partida…</h1><div id="loadInfo"></div></div>

<!-- TIENDA -->
<div id="shop" class="overlay"><div class="panel"><h2>Tienda <span class="muted" id="shopGold"></span></h2><div class="muted" id="shopNote"></div><div class="shop-grid" id="shopItems"></div>
  <h2>Inventario <span class="muted">(clic para vender al 70%)</span></h2><div class="row" id="shopInv"></div><p><button onclick="UI.toggleShop(false)">Cerrar (P / Esc)</button></p></div></div>

<!-- MARCADOR -->
<div id="score" class="overlay"><div class="panel" style="min-width:820px"><h2>Marcador</h2><div id="scoreBody"></div></div></div>

<!-- PAUSA / OPCIONES -->
<div id="pause" class="overlay"><div class="panel" style="min-width:520px">
  <h2 id="pauseTitle">Pausa</h2>
  <div id="optsBody"></div>
  <p class="row"><button id="resumeBtn">Continuar</button><button id="surrBtn">Rendirse</button><button id="quitBtn">Salir al menú</button></p>
</div></div>

<!-- AYUDA -->
<div id="help" class="overlay"><div class="panel" style="max-width:760px"><h2>Controles</h2><div id="helpBody"></div><p><button onclick="document.getElementById('help').classList.remove('on')">Cerrar</button></p></div></div>

<!-- FIN -->
<div id="end" class="screen"><h1 id="endTitle"></h1><div id="endBody"></div><p><button class="big" onclick="location.reload()">Volver al menú</button></p></div>

<div id="tutorial"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
