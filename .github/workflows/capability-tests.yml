name: Capability tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y jq
      - run: python3 tools/build_design.py --check
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --prefix game
      - run: node --test game/tests/game.test.mjs
      - run: node game/tools/validate_models.mjs --current || true   # informe (los provisionales aún no cumplen)
      - run: node game/tools/bundle.mjs
      - run: pip install playwright && python -m playwright install --with-deps chromium && python3 game/tests/e2e_browser.py
      - run: python3 studio-tests/run_capability_tests.py --junit result.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capability-results, path: result.xml }
